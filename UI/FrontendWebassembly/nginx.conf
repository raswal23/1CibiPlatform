# Hide the nginx version in the Server header and built-in error pages
# (VAPT finding: server version disclosure)
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html to avoid serving stale boot manifest/SRI metadata
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Blazor WebAssembly framework files (must never fall back to index.html)
    location ^~ /_framework/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Blazor static web assets from packages/libraries.
    # NOT fingerprinted in standalone WASM publish output (e.g.
    # _content/MudBlazor/MudBlazor.min.css keeps a stable name), so browsers
    # must revalidate via ETag or a package upgrade would be invisible for a year.
    location ^~ /_content/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Correct MIME type for WebAssembly files
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache compressed assets produced by publish
    location ~* \.(?:br|gz)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App JS is content-fingerprinted at publish (StaticWebAssetFingerprintPattern
    # in the csproj renames e.g. nameFilter.js -> nameFilter.08j5zj0alz.js), so a
    # deploy changes the URL and these can be cached forever.
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # CSS and JSON keep stable file names (HTML placeholders don't support
    # stylesheets yet - dotnet/aspnetcore#64170 - and appsettings.json is
    # fetched by name at boot). no-cache = cache but revalidate with ETag,
    # so users pick up new versions on the next load after a deploy.
    location ~* \.(?:css|json)$ {
        add_header Cache-Control "no-cache";
    }

    # General static file caching (images/fonts and misc payload files)
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff2?|eot|ttf|otf|dll|dat|webcil)$ {
        expires 1M;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Required for Blazor WebAssembly client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
