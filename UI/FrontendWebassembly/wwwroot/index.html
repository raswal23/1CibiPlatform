    <!-- CSS keeps stable names: .NET 10 HTML placeholders don't support
         stylesheets yet (dotnet/aspnetcore#64170). nginx serves *.css with
         Cache-Control: no-cache so browsers revalidate after each deploy.
         ?v=2 is a ONE-TIME bump to evict copies cached under the old nginx
         config (1-month/1-year max-age, no revalidation). Do not bump again;
         ETag revalidation handles freshness from here on. -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css?v=2" />
    <link rel="stylesheet" href="css/app.css?v=2" />
    <link href="_content/MudBlazor/MudBlazor.min.css?v=2" rel="stylesheet" />

    <link href="FrontendWebassembly.styles.css?v=2" rel="stylesheet" />
    <link rel="icon" href="/images/generic/cibi-icon.png" type="image/png" />
    <script type="importmap"></script>

    <script>
        (function () {
            const isDark = localStorage.getItem('isDarkMode');

            if (isDark === 'true') {
                document.documentElement.classList.add('dark-startup');
            }
        })();

        window.setStartupTheme = function (isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark-startup');
            } else {
                document.documentElement.classList.remove('dark-startup');
            }
        };

        window.getViewportWidth = function () {
            return window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        };
    </script>
</head>

    <!-- The fingerprint markers below are replaced at build/publish with a
         content hash (OverrideHtmlAssetPlaceholders + StaticWebAssetFingerprintPattern
         in the csproj), so every deploy gets fresh URLs and browsers can cache forever.
         Do not write the literal marker in comments: the placeholder scanner matches
         it and silently skips the next real one. -->
    <script src="js/generic/navigationLock#[.{fingerprint}].js"></script>
    <script src="js/philsys/downloadResponse#[.{fingerprint}].js"></script>
    <script src="js/philsys/everify-liveness-sdk.min#[.{fingerprint}].js"></script>
    <script src="js/philsys/livenessInterop#[.{fingerprint}].js"></script>
    <script src="js/ats/downloadFile#[.{fingerprint}].js"></script>

    <script src="js/ats/atsAssistant#[.{fingerprint}].js"></script>
    <script src="js/generic/fileInputInterop#[.{fingerprint}].js"></script>
    <script src="js/generic/nameFilter#[.{fingerprint}].js"></script>
